name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Check, test, and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp check
      - run: vp test
      - run: vp pack
