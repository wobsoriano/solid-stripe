packages:
  - playground
  - .

overrides:
  vite@*: 'catalog:'

onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
catalog:
  # One solid-js for the library and the playground. Two copies break reactivity.
  solid-js: ^1.9.17
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
