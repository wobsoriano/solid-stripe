packages:
  - playground
  - .

overrides:
  vite@*: 'catalog:'

onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
catalog:
  # One solid-js and @solidjs/web for the library and the playground. Two copies break reactivity.
  '@solidjs/web': 2.0.0-rc.19
  solid-js: 2.0.0-rc.19
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
